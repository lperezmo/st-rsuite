name: Build & Publish to PyPI (Manual)

# Fallback for manual tag-based releases.
# Automated releases are handled by release.yml via python-semantic-release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      # Build all frontend components
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: st_rsuite/frontend/package.json
          # Publishing must not restore caches writable by other workflows.
          no-cache: true
      - run: |
          bun install --frozen-lockfile
          bun run build
        working-directory: st_rsuite/frontend

      - name: Assert production build
        run: bash scripts/assert_prod_build.sh

      # Build the Python dists
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: { python-version: '3.13' }
      - run: |
          python -m pip install --upgrade build
          python -m build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist/

  publish:
    needs: [build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist/
          verbose: true
          attestations: false
