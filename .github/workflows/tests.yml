name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The Python counterpart to the frontend typecheck below, and the cheapest
  # gate here, so it runs first. `check .` rather than a list of directories:
  # a list silently stops covering anything added later, which is the same rot
  # that left new test files unrun in the sibling st-aggrid repo.
  # The rule set and the ruff version both come from pyproject.toml, which
  # ruff-action reads: see the pin comment there for why the upper bound
  # matters as much as the floor.
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/ruff-action@4919ec5cf1f49eff0871dbcea0da843445b837e6 # v3
        with:
          args: check .

  # TypeScript type check of the frontend, plus the bun unit tests (today only
  # the bun.lock dependency snapshot script). The type check runs independently
  # of the build (Vite transpiles without type-checking), so it is the only gate
  # that catches type regressions such as passing a prop RSuite does not accept.
  typecheck:
    name: Test and typecheck frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: st_rsuite/frontend/package.json
      - run: bun install --frozen-lockfile
        working-directory: st_rsuite/frontend
      - run: bun test
        working-directory: st_rsuite/frontend
      - run: bun run typecheck
        working-directory: st_rsuite/frontend

  # bun fmt is stable since 1.4.4, but bun lint is canary-only until a stable
  # release ships it, so this job runs canary while every other job stays on the
  # bun version pinned in package.json. Neither needs node_modules. bunfig.toml
  # sets endOfLine "auto" so the check agrees with CRLF working trees on Windows
  # and LF checkouts here.
  format-and-lint:
    name: Format and lint frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: canary
      - run: bun fmt --check .
        working-directory: st_rsuite/frontend
      - run: bun lint --max-warnings 0 --format github
        working-directory: st_rsuite/frontend

  # Build the frontend once and share the built assets with every test leg.
  # build/ is gitignored, so without this the package can't register components.
  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: st_rsuite/frontend/package.json
      - run: bun install --frozen-lockfile && bun run build
        working-directory: st_rsuite/frontend
      - name: Assert production build
        run: bash scripts/assert_prod_build.sh
      - run: tar czf frontend-build.tgz st_rsuite/frontend/build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: frontend-build
          path: frontend-build.tgz
          retention-days: 1

  # The whole browser-less suite across every supported Streamlit minor: a real
  # `streamlit run` would register the shared component every widget renders
  # through, and the compat layer can disable style isolation (at registration
  # on >=1.53, call site on 1.51/1.52).
  #
  # It ran only test_registration_smoke.py until the marker split, so date
  # serialization, radio tile returns and range callbacks were exercised
  # against a single Streamlit version inside the browser job. That is the
  # coverage the sibling st-aggrid repo has had all along, and it is where its
  # pandas 3 regression surfaced: on one leg of a matrix like this one.
  #
  # The empty entry is the floating leg: `pip install -U streamlit`, whatever
  # is newest that day. It is not a substitute for pinning each minor, because
  # it moves. When 1.61 ships it stops covering 1.60 and nothing else would,
  # so every new minor gets a pin here as it lands.
  python-suite:
    name: Python (Streamlit ${{ matrix.streamlit || 'latest' }})
    needs: build-frontend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        streamlit: ['1.51.*', '1.52.*', '1.53.*', '1.54.*', '1.55.*', '1.56.*', '1.57.*', '1.58.*', '1.59.*', '1.60.*', '']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: frontend-build
      - run: tar xzf frontend-build.tgz
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
      - run: uv sync --group dev
      - name: Select Streamlit version
        run: |
          if [ -n "${{ matrix.streamlit }}" ]; then
            uv pip install "streamlit==${{ matrix.streamlit }}"
          else
            uv pip install -U streamlit
          fi
      - run: uv run --no-sync python -c "import streamlit; print('streamlit', streamlit.__version__)"
      - run: uv run --no-sync pytest test/ -m "not browser" -v

  # Real-browser coverage: every component renders and round-trips on a real
  # Streamlit server. Authoritative guard for the asset_dir registration bug.
  e2e:
    name: e2e (Streamlit ${{ matrix.streamlit || 'latest' }})
    needs: build-frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        streamlit: ['1.51.*', '1.52.*', '1.53.*', '1.55.*', '']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: frontend-build
      - run: tar xzf frontend-build.tgz
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
      - run: uv sync --group dev
      - name: Select Streamlit version
        run: |
          if [ -n "${{ matrix.streamlit }}" ]; then
            uv pip install "streamlit==${{ matrix.streamlit }}"
          else
            uv pip install -U streamlit
          fi
      - run: uv run --no-sync playwright install --with-deps chromium
      - run: uv run --no-sync python -c "import streamlit; print('streamlit', streamlit.__version__)"
      # Selected by marker, never by filename. Enumerating files here once
      # silently dropped test_value_sync_e2e / test_a11y_e2e /
      # test_date_constraints_e2e / test_range_shortcuts_e2e /
      # test_time_constraints_e2e, half the e2e tests, including the entire
      # useSyncedValue regression guard.
      #
      # `-m browser` rather than the whole directory: the browser-less tests
      # used to ride along here, so they were reported by this job on the five
      # Streamlit versions it covers instead of the nine the Python job covers,
      # and a pure-logic failure read as a browser flake.
      - run: uv run --no-sync pytest test/ -m browser -v
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: playwright-results-st${{ matrix.streamlit || 'latest' }}
          path: test-results/
          retention-days: 7

  # Guard the wheel itself: the runtime manifest and built JS must ship, or
  # every user hits "must be declared ... with asset_dir" regardless of version.
  package:
    name: Wheel contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: st_rsuite/frontend/package.json
      - run: bun install --frozen-lockfile && bun run build
        working-directory: st_rsuite/frontend
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - run: uv build --wheel
      - name: Assert wheel ships the manifest and built assets
        run: |
          uv run --no-project python - <<'PY'
          import fnmatch, glob, zipfile
          whl = sorted(glob.glob("dist/*.whl"))[-1]
          names = set(zipfile.ZipFile(whl).namelist())
          assert "st_rsuite/pyproject.toml" in names, "wheel is missing st_rsuite/pyproject.toml"
          prefix = "st_rsuite/frontend/build/"
          built = [n[len(prefix):] for n in names if n.startswith(prefix)]
          entries = fnmatch.filter(built, "index-*.js")
          assert len(entries) == 1, \
              f"wheel must ship exactly one index-*.js entry (js glob), found {entries}"
          locales = fnmatch.filter(built, "chunk-*.js")
          assert locales, "wheel is missing the shared/locale chunks"
          maps = fnmatch.filter(built, "*.js.map")
          assert not maps, f"wheel must not ship sourcemaps, found {maps}"
          stale = [n for n in names if "/frontend/" in n and not n.startswith(prefix)]
          assert not stale, \
              f"wheel ships stale per-component frontend files (wipe build/lib): {stale[:5]}"
          print(f"OK: {whl} ships the manifest, one entry, and {len(locales)} chunks")
          PY
