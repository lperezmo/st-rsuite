name: Release & Publish

# Gated on Tests rather than on `push` directly. Both workflows used to trigger
# on the same push and run independently, so a tag and a PyPI upload could race
# a typecheck/e2e leg that was still running (or already red). workflow_run
# fires only after the Tests run for this branch has finished, and the job-level
# `if` below keeps anything but a green run from releasing.
on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [main]

# Serialize releases: two pushes landing close together must not have their
# semantic-release runs interleave. Never cancel in progress, a half-finished
# publish is worse than a queued one.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    # The `branches: [main]` filter above matches the TRIGGERING run's head
    # branch, and Tests also runs on pull_request, so a fork PR opened from the
    # contributor's own `main` would satisfy it. Requiring the upstream event to
    # be a push keeps pull requests from reaching the PyPI publish at all.
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          # workflow_run checkouts default to the default branch; be explicit,
          # and take full history so semantic-release can read the tag log.
          # This is the tip of main, not workflow_run.head_sha, because
          # semantic-release has to commit and push back to the branch. The
          # guard below then refuses to release when the tip has moved past the
          # commit the green Tests run actually covered.
          ref: main
          fetch-depth: 0

      - name: Refuse to release an untested tip
        id: guard
        run: |
          tested='${{ github.event.workflow_run.head_sha }}'
          tip="$(git rev-parse HEAD)"
          if [ "$tip" != "$tested" ]; then
            echo "Tests passed on $tested but main is now at $tip." >> "$GITHUB_STEP_SUMMARY"
            echo "Skipping: releasing would publish code this run never tested." >> "$GITHUB_STEP_SUMMARY"
            echo 'stale=true' >> "$GITHUB_OUTPUT"
          fi

      # Skipped rather than failed: a second push landing during this run is
      # ordinary, and its own Tests run brings its own Release run. Because
      # semantic-release reads every commit since the last tag, the release
      # skipped here is not lost, it is folded into that later run.

      - uses: actions/setup-python@v6
        if: steps.guard.outputs.stale != 'true'
        with: { python-version: '3.13' }

      - name: Semantic Release
        id: release
        if: steps.guard.outputs.stale != 'true'
        uses: python-semantic-release/python-semantic-release@v9
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

  build-dist:
    needs: [release]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.tag }}

      # Build frontend
      - uses: actions/setup-node@v6
        with: { node-version: '22' }
      - run: npm ci && npm run build
        working-directory: st_rsuite/frontend

      - name: Assert production build
        run: bash scripts/assert_prod_build.sh

      # Build Python package
      - uses: actions/setup-python@v6
        with: { python-version: '3.13' }
      - run: |
          python -m pip install --upgrade build
          python -m build

      - uses: actions/upload-artifact@v7
        with:
          name: release-dist
          path: dist/

  upload-release-assets:
    needs: [release, build-dist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: release-dist
          path: dist/

      # Upload dists to the GitHub Release that semantic-release already created.
      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release.outputs.tag }}" dist/* --clobber

  publish:
    needs: [release, build-dist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: release-dist
          path: dist/

      # This job handles the completed artifact only; no build dependencies run
      # with the PyPI OIDC capability.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          verbose: true
          attestations: false

  bump-demo:
    # publish, not just release: the demo app's requirements.txt must never
    # name a version PyPI cannot serve yet. Depending on release alone ran this
    # job alongside publish, so the bump commit landed - and the demo app
    # redeployed against it - before the wheel had been uploaded at all. A
    # ">=" floor is no safer than an exact pin here, because pip cannot satisfy
    # a floor above the newest published version.
    needs: [release, publish]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v6
        with: { python-version: '3.13' }

      # A successful upload is not the same as an installable release: the
      # index and the CDN in front of the files take their own time to catch
      # up. Poll the thing the demo app actually does - resolve and fetch the
      # wheel from PyPI - rather than sleeping a fixed guess.
      - name: Wait for the release to be installable from PyPI
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          dest="$(mktemp -d)"
          deadline=$(( SECONDS + 600 ))
          attempt=0
          until pip download "st-rsuite==${VERSION}" \
              --no-deps --only-binary=:all: --no-cache-dir \
              --dest "$dest" >/dev/null 2>&1; do
            attempt=$(( attempt + 1 ))
            if (( SECONDS >= deadline )); then
              echo "::error::st-rsuite==${VERSION} was still not installable"\
                   "from PyPI after 10 minutes. The demo app was left on the"\
                   "previous version; re-run this job once the release shows"\
                   "up on PyPI."
              exit 1
            fi
            echo "Attempt ${attempt}: ${VERSION} not on PyPI yet, retrying in 15s"
            sleep 15
          done
          # This runner reached one CDN edge; the one serving the demo app's
          # build may be a few seconds behind it.
          echo "${VERSION} is installable. Letting the CDN settle for 30s."
          sleep 30

      - name: Bump demo app version requirement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          VERSION=${{ needs.release.outputs.version }}
          sed -i "s/st-rsuite>=.*/st-rsuite>=${VERSION}/" examples/requirements.txt
          git add examples/requirements.txt
          git commit -m "chore: bump demo app requirement to v${VERSION}"
          git push
