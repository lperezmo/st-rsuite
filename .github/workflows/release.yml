name: Release & Publish

# Gated on Tests rather than on `push` directly. Both workflows used to trigger
# on the same push and run independently, so a tag and a PyPI upload could race
# a typecheck/e2e leg that was still running (or already red). workflow_run
# fires only after the Tests run for this branch has finished, and the job-level
# `if` below keeps anything but a green run from releasing.
on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [main]

# Serialize releases: two pushes landing close together must not have their
# semantic-release runs interleave. Never cancel in progress, a half-finished
# publish is worse than a queued one.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          # workflow_run checkouts default to the default branch; be explicit,
          # and take full history so semantic-release can read the tag log.
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with: { python-version: '3.13' }

      - name: Semantic Release
        id: release
        uses: python-semantic-release/python-semantic-release@v9
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: [release]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release.outputs.tag }}

      # Build frontend
      - uses: actions/setup-node@v6
        with: { node-version: '22' }
      - run: npm ci && npm run build
        working-directory: st_rsuite/frontend

      - name: Assert production build
        run: bash scripts/assert_prod_build.sh

      # Build Python package
      - uses: actions/setup-python@v6
        with: { python-version: '3.13' }
      - run: |
          python -m pip install --upgrade build
          python -m build

      # Upload dists to the GitHub Release that semantic-release already created
      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release.outputs.tag }}" dist/* --clobber

      # Publish to PyPI
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          verbose: true
          attestations: false

  bump-demo:
    needs: [release]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump demo app version requirement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          VERSION=${{ needs.release.outputs.version }}
          sed -i "s/st-rsuite>=.*/st-rsuite>=${VERSION}/" examples/requirements.txt
          git add examples/requirements.txt
          git commit -m "chore: bump demo app requirement to v${VERSION}"
          git push
