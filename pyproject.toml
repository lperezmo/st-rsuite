[build-system]
requires = ["setuptools>=70,<77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "st-rsuite"
version = "0.9.1"
description = "RSuite UI components for Streamlit: pickers, trees, carousel, timeline, and more."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{ name = "Luis Perez", email = "lperezmo@users.noreply.github.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: User Interfaces",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Environment :: Web Environment",
]
keywords = ["streamlit", "rsuite", "datepicker", "timepicker", "daterangepicker", "components"]
dependencies = [
    "streamlit>=1.51",
]

[project.urls]
Homepage = "https://github.com/lperezmo/st-rsuite"
Repository = "https://github.com/lperezmo/st-rsuite"
Issues = "https://github.com/lperezmo/st-rsuite/issues"



[dependency-groups]
dev = [
    "pytest>=8",
    "playwright>=1.49",
    "pytest-playwright>=0.6",
    "requests>=2.32",
    "build>=1.2",
    # Pinned to the 0.16 line because the lint config relies on that
    # generation's default rule set (413 rules, up from 59). An older ruff
    # reports a small subset and disagrees with CI. The upper bound matters
    # just as much: `astral-sh/ruff-action` reads this constraint and installs
    # the newest release satisfying it, so an unbounded floor lets the next
    # default expansion turn CI red on unchanged code. That is not
    # hypothetical: it is exactly what 0.16.0 did to the sibling st-aggrid
    # repo, 143 findings on untouched code. Raising this is a deliberate
    # change with its own triage pass.
    "ruff>=0.16,<0.17",
]

[tool.setuptools.packages.find]
include = ["st_rsuite*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.exclude-package-data]
"*" = ["*.js.map"]

[tool.setuptools.package-data]
"st_rsuite" = ["pyproject.toml", "frontend/build/**/*"]

[tool.semantic_release]
version_toml = [
    "pyproject.toml:project.version",
    "st_rsuite/pyproject.toml:project.version",
]
tag_format = "v{version}"
commit_message = "chore(release): v{version}"

[tool.pytest.ini_options]
# CI selects suites by marker, not by filename. The version matrix used to run
# `pytest test/test_registration_smoke.py`, so three browser-less files
# (date serialization, radio tile returns, range callbacks) were checked
# against exactly one Streamlit version, inside the browser job. Naming files
# in a workflow means a file added later is excluded by default and nobody
# notices; with a marker the default is inclusion, and silence means "no
# tests" rather than "not wired up".
markers = [
    "browser: needs a real browser and a running Streamlit server (Playwright)",
]

[tool.ruff]
extend-exclude = ["references/"]

[tool.ruff.lint]
# No explicit `select`: the rule set is ruff's own default, which 0.16.0 grew
# from 59 rules to 413. The dev dependency floor is `ruff>=0.16` so that a
# local run and the CI run agree on what "default" means; an older ruff would
# silently check a much smaller set and let new findings through. This mirrors
# the sibling st-aggrid configuration so the two repos lint identically.

[tool.ruff.lint.isort]
# `e2e_utils` (tests) and `utils` (examples) are sibling modules imported by
# path rather than installed packages. Without this they sort into the
# third-party block, above st_rsuite itself, which reads as if the example apps
# were importing the library from somewhere else.
known-local-folder = ["e2e_utils", "utils"]

[tool.ruff.lint.per-file-ignores]
# DTZ wants an explicit tzinfo on every date and datetime construction. This
# package is a wrapper around date and time pickers, where a naive local date
# is a first-class supported input rather than an oversight, and the shipped
# package has zero DTZ findings: every one is in a demo page or a date test.
# `date.today()` is what a date picker demo should show.
"examples/app_pages/date_pickers.py" = ["DTZ011"]
"examples/app_pages/inputs.py" = ["DTZ011"]
"examples/app_pages/locale.py" = ["DTZ011"]
# Naive datetimes are the subject under test here, not an accident: the fixture
# list holds naive and tz-aware values side by side and one test is named
# test_naive_datetime_drops_the_time. Requiring tzinfo would mean deleting the
# cases that cover the behavior.
"test/test_date_serialization.py" = ["DTZ001"]
"test/review_findings_e2e_app.py" = ["DTZ001"]
"test/e2e_utils.py" = [
    # The temp file is owned by AsyncSubprocess across start() and stop() and is
    # closed there, so it deliberately outlives the statement that opens it. A
    # context manager cannot express that lifetime.
    "SIM115",
    # PYI034 wants `__enter__` annotated with `typing.Self`, which is 3.11+.
    # The package supports 3.10 and does not depend on typing_extensions, so the
    # class name is the only annotation available.
    "PYI034",
]
